      + '<div class="card" style="margin-top:12px"><label class="sw"><span><b>Narx nazorati</b><br><span class="muted">Sotuvchi belgilangan oraliqdan tashqari narxda sota olmaydi</span></span><input type="checkbox" id="zO"' + (s.on ? " checked" : "") + '></label><label class="sw"><span><b>Narxsiz tovarni sotishni taqiqlash</b><br><span class="muted">Narxi belgilanmagan tovar sotilmaydi</span></span><input type="checkbox" id="zS"' + (s.strict ? " checked" : "") + "></label></div>"

    chipPick("zC", "c", function (v) { cur = v; });

  }, fail);
} };
